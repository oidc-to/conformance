name: Conformance

# oidcc-test-plan against a deployed oidc.to, one job per variant, merged into one table.
on:
  workflow_dispatch:
    inputs:
      issuer:
        description: The deployed oidc.to's issuer
        required: true
        default: https://oidc.to.scaffoldly.dev
      max_parallel:
        description: Matrix jobs run at once; default the CONFORMANCE_MAX_PARALLEL variable, else 256
        required: false

permissions:
  contents: read

concurrency:
  group: conformance-${{ inputs.issuer }}
  cancel-in-progress: true

env:
  PLAN: oidcc-test-plan
  CONFIG: configs/oidc.to.mjs

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - id: variants
        run: node bin/oidc-conformance.mjs variants --plan "$PLAN"

  conformance:
    needs: variants
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel || vars.CONFORMANCE_MAX_PARALLEL || '256') }}
      matrix:
        include: ${{ fromJSON(needs.variants.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: ./
        with:
          issuer: ${{ inputs.issuer }}
          plan: ${{ env.PLAN }}
          variant: ${{ matrix.variant }}
          config: ${{ env.CONFIG }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}
          # The suite's exported plans hold the clients' secrets and private keys; this repo is public.
          path: |
            .conformance/results
            !.conformance/results/*.zip
          if-no-files-found: ignore

  summary:
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: jobs
      - run: node bin/oidc-conformance.mjs merge --out merged jobs/*/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: |
            merged
            jobs
