name: Conformance

# oidcc-test-plan against a deployed oidc.to, one job per variant (or one for them all), merged into one table.
on:
  workflow_dispatch:
    inputs:
      issuer:
        description: The deployed oidc.to's issuer
        required: true
        default: https://oidc.to.scaffoldly.dev
      max_parallel:
        description: Matrix jobs run at once; 0 runs every variant in one job; default the CONFORMANCE_MAX_PARALLEL variable, else 256
        required: false

permissions:
  contents: read

concurrency:
  group: conformance-${{ inputs.issuer }}
  cancel-in-progress: true

env:
  PLAN: oidcc-test-plan
  CONFIG: configs/oidc.to.mjs
  MAX_PARALLEL: ${{ inputs.max_parallel || vars.CONFORMANCE_MAX_PARALLEL || '256' }}

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
      max-parallel: ${{ steps.variants.outputs.max-parallel }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      # The same entry the action restores, filled here when cold so the matrix starts warm.
      - id: cache-key
        if: env.MAX_PARALLEL != '0'
        run: |
          tag=$(node --input-type=module -e 'console.log((await import("./src/suite.mjs")).tag)')
          echo "key=oidc-conformance-${{ runner.os }}-${{ runner.arch }}-$tag-$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - if: env.MAX_PARALLEL != '0'
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/oidc-conformance
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
      # 0 is one job with no variant filter, which runs them all in turn.
      - id: variants
        run: |
          if [ "$MAX_PARALLEL" = 0 ]; then
            jq -cn --arg name "$PLAN: every variant" '"matrix=" + ([{variant: "", name: $name}] | tojson)' -r >> "$GITHUB_OUTPUT"
            echo "max-parallel=1" >> "$GITHUB_OUTPUT"
          else
            CONFORMANCE_CACHE="$HOME/.cache/oidc-conformance" node bin/oidc-conformance.mjs variants --plan "$PLAN"
            echo "max-parallel=$MAX_PARALLEL" >> "$GITHUB_OUTPUT"
          fi

  conformance:
    needs: variants
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours.
    timeout-minutes: ${{ matrix.variant == '' && 360 || 120 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.variants.outputs.max-parallel) }}
      matrix:
        include: ${{ fromJSON(needs.variants.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: ./
        with:
          issuer: ${{ inputs.issuer }}
          plan: ${{ env.PLAN }}
          variant: ${{ matrix.variant }}
          config: ${{ env.CONFIG }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}
          # The suite's exported plans hold the clients' secrets and private keys; this repo is public.
          path: |
            .conformance/results
            !.conformance/results/*.zip
          if-no-files-found: ignore

  summary:
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: jobs
      - run: node bin/oidc-conformance.mjs merge --out merged jobs/*/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: |
            merged
            jobs
