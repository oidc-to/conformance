name: Conformance

# oidcc-test-plan against a deployed oidc.to, split across jobs, merged into one table.
on:
  workflow_dispatch:
    inputs:
      issuer:
        description: The deployed oidc.to's issuer
        required: true
        default: https://oidc.to.scaffoldly.dev
      max_parallel:
        description: Jobs, each one suite and tunnel running its share of the variants in turn; 0 or 1 is one job; default the CONFORMANCE_MAX_PARALLEL variable, else 10
        required: false

permissions:
  contents: read

concurrency:
  group: conformance-${{ inputs.issuer }}
  cancel-in-progress: true

env:
  PLAN: oidcc-test-plan
  CONFIG: configs/oidc.to.mjs
  MAX_PARALLEL: ${{ inputs.max_parallel || vars.CONFORMANCE_MAX_PARALLEL || '10' }}

jobs:
  variants:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.variants.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      # The same entry the action restores, filled here when cold so the matrix starts warm.
      - id: cache-key
        run: |
          tag=$(node --input-type=module -e 'console.log((await import("./src/suite.mjs")).tag)')
          echo "key=oidc-conformance-${{ runner.os }}-${{ runner.arch }}-$tag-$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/oidc-conformance
            ~/.cache/pip
            ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
      # As many jobs as MAX_PARALLEL, so as many suite tunnels open at once and per run.
      - id: variants
        run: CONFORMANCE_CACHE="$HOME/.cache/oidc-conformance" node bin/oidc-conformance.mjs variants --plan "$PLAN" --jobs "$MAX_PARALLEL"

  conformance:
    needs: variants
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # GitHub-hosted jobs stop at 6 hours.
    timeout-minutes: 360
    # The identity token is then an OIDC JWT, not the job's runtime token.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.variants.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: identity
        id: identity
        uses: cnuss/actions-identity@v1
      - uses: ./
        env:
          # Names this run to tunnel.pizza for the suite's tunnel.
          LIBTUNNEL_TOKEN: ${{ steps.identity.outputs.token }}
        with:
          issuer: ${{ inputs.issuer }}
          plan: ${{ env.PLAN }}
          variant: ${{ matrix.variant }}
          config: ${{ env.CONFIG }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: conformance-${{ strategy.job-index }}
          # The suite's exported plans hold the clients' secrets and private keys; this repo is public.
          path: |
            .conformance/results
            !.conformance/results/*.zip
          if-no-files-found: ignore

  summary:
    needs: conformance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --omit=dev --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          pattern: conformance-*
          path: jobs
      - run: node bin/oidc-conformance.mjs merge --out merged jobs/*/summary.json
      - uses: actions/upload-artifact@v7
        with:
          name: conformance
          path: |
            merged
            jobs
